name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Run RuboCop
        run: bundle exec rubocop

  security:
    name: Security audit
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Run bundler-audit
        run: bundle exec rake bundle:audit:update bundle:audit:check

  test:
    name: Ruby ${{ matrix.ruby }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ruby:
          - "3.3"
          - "3.4"
          - "4.0"

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true

      - name: Run test suite
        run: bundle exec rake spec

      # simplecov_json_formatter marks lines inside `# simplecov:disable` blocks with the
      # string "ignored" instead of a hit count. Codecov cannot parse that, so the upload
      # "succeeds" but processing errors and the badge reads 0%. Map those lines to null
      # (not a line) and write a report Codecov accepts.
      - name: Convert coverage report for Codecov
        if: matrix.ruby == '3.4'
        run: |
          ruby -rjson -e '
            root = Dir.pwd + "/"
            src = JSON.parse(File.read("coverage/coverage.json"))
            out = { "coverage" => src["coverage"].to_h { |f, d| [f.delete_prefix(root), d["lines"].map { |l| l.is_a?(Integer) ? l : nil }] } }
            File.write("coverage/codecov.json", JSON.generate(out))
          '

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        if: matrix.ruby == '3.4'
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage/codecov.json
          # Only upload the converted report; auto-discovery also finds the raw coverage.json.
          disable_search: true
          fail_ci_if_error: true
